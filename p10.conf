# Datos de la entrega de la Practica 10.
# Deben coincidir EXACTAMENTE con la tabla 4.1 del README de su entrega.

CARNET="202010175"
REPO_CODE="https://github.com/yaniadavid/Practicas-SA-B-202010175-P10"
REPO_GITOPS="https://github.com/yaniadavid/Practicas-SA-B-202010175-P8"

NS="sa-p8"                      # namespace de la aplicacion
NS_OBS="observability"          # namespace del stack de observabilidad
ROLLOUT="pets-service"          # nombre del Rollout gobernado por metricas

# Los tres servicios instrumentados, separados por espacios.
SERVICIOS="api-gateway appointments-service pets-service"

# Servicio de Prometheus dentro de NS_OBS y su puerto.
PROM_SVC="monitoring-prometheus"
PROM_PORT="9090"

# Nombre EXACTO de una metrica de negocio que usted expone.
METRICA_NEGOCIO="sa_appointments_created_total"

# Nombre EXACTO de la regla de registro que calcula su indicador (SLI).
REGLA_SLI="p10:availability:sli7d"

# Un pod cuyos registros deben salir en JSON (prefijo del nombre).
POD_LOGS="appointments-service"
