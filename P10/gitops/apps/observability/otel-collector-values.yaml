mode: deployment
fullnameOverride: otel-collector
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
resources:
  requests:
    cpu: 75m
    memory: 128Mi
  limits:
    cpu: 400m
    memory: 384Mi
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
config:
  exporters:
    debug: null
    otlphttp/tempo:
      endpoint: http://tempo.observability.svc.cluster.local:4318
    otlphttp/prometheus:
      endpoint: http://monitoring-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
  service:
    pipelines:
      logs: null
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/prometheus]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlphttp/tempo]
