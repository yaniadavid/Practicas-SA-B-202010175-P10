apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-slo-rules
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/yaniadavid/Practicas-SA-B-202010175-P8.git
    targetRevision: main
    path: apps/observability/slo-rules
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
