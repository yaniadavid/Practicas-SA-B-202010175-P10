apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.176.0
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/apps/observability/otel-collector-values.yaml
    - repoURL: https://github.com/yaniadavid/Practicas-SA-B-202010175-P8.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
