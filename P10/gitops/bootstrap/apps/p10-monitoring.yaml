apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p10-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.9.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/apps/observability/monitoring-values.yaml
    - repoURL: https://github.com/yaniadavid/Practicas-SA-B-202010175-P8.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ClientSideApplyMigration=false
